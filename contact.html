<!doctype html>
<!-- Contact popup — Amine portfolio -->
<!-- Design tokens mirror the site: Inter, orange #f94706 accent,
     #f2f2f2 surfaces, 24px card radius, 0 5px 20px rgba(0,0,0,.05)
     shadows, subtle 0.2-0.35s easing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Amine</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("./assets/fonts/framer/Inter-Regular.latin-JLQMKCHE.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("./assets/fonts/framer/Inter-Bold.latin-UCM45LQF.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --accent: #f94706;
    --surface: #f2f2f2;
    --ink: #000000;
    --muted: #4d4d4d;
    --shadow: 0 5px 20px 0 rgba(0, 0, 0, 0.05);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }

  body {
    font-family: "Inter", "Public Sans", -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .ct-root {
    width: 100%;
    max-width: 420px;
    padding: 40px 24px 32px;
  }

  /* ---------- header ---------- */
  .ct-kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 0 0 8px;
  }
  .ct-kicker::before,
  .ct-kicker::after {
    content: "";
    height: 1px;
    width: 40px;
    background: var(--ink);
    opacity: 0.15;
  }
  .ct-title {
    font-weight: 700;
    font-size: 32px;
    line-height: 1.1;
    text-align: center;
    margin: 0 0 10px;
  }
  .ct-title em {
    font-style: normal;
    color: var(--accent);
  }
  .ct-sub {
    font-size: 14px;
    line-height: 1.5;
    color: var(--muted);
    text-align: center;
    margin: 0 0 28px;
  }

  /* ---------- contact cards ---------- */
  .ct-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .ct-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border-radius: 24px;
    padding: 14px 18px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: var(--shadow);
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  }
  .ct-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px 0 rgba(0, 0, 0, 0.1);
    background: #ffffff;
  }
  .ct-card:active {
    transform: translateY(0);
  }

  .ct-avatar {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
  }
  .ct-avatar svg {
    width: 24px;
    height: 24px;
    fill: #ffffff;
    display: block;
  }
  .ct-avatar--instagram { background: linear-gradient(45deg, #f9ce34 0%, #ee2a7b 50%, #6228d7 100%); }
  .ct-avatar--linkedin  { background: #0a66c2; }
  .ct-avatar--whatsapp  { background: #25d366; }
  .ct-avatar--telegram  { background: #229ed9; }

  .ct-info {
    flex: 1 1 auto;
    min-width: 0;
  }
  .ct-name {
    font-weight: 700;
    font-size: 16px;
    line-height: 1.25;
    margin: 0;
  }
  .ct-handle {
    font-size: 13px;
    line-height: 1.4;
    color: var(--muted);
    margin: 2px 0 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ct-arrow {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--ink);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .ct-card:hover .ct-arrow {
    background: var(--accent);
    transform: translateX(2px);
  }
  .ct-arrow svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- footer ---------- */
  .ct-foot {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .ct-foot strong {
    color: var(--accent);
  }

  /* ---------- entrance animation ---------- */
  @keyframes ct-in {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .ct-kicker { animation: ct-in 0.35s ease both; }
  .ct-title { animation: ct-in 0.35s ease 0.05s both; }
  .ct-sub { animation: ct-in 0.35s ease 0.1s both; }
  .ct-card { animation: ct-in 0.35s ease both; }
  .ct-card:nth-child(1) { animation-delay: 0.12s; }
  .ct-card:nth-child(2) { animation-delay: 0.18s; }
  .ct-card:nth-child(3) { animation-delay: 0.24s; }
  .ct-card:nth-child(4) { animation-delay: 0.3s; }
  .ct-foot { animation: ct-in 0.35s ease 0.36s both; }
</style>
</head>
